image: alpine:latest

stages:
  - sync

variables:
  GIT_STRATEGY: fetch

sync:packages:
  stage: sync

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - packages/**/*

  before_script:
    - apk add --no-cache git rsync openssh
  script:
    - set -e
    - echo "Script action ..."
      fi

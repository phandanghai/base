image: node:24-alpine

stages:
  - prepare
  - lint
  - test
  - build

variables:
  NPM_CONFIG_LOGLEVEL: warn
  PNPM_CACHE_FOLDER: .pnpm-store

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .pnpm-store
    - apps/*/node_modules/
    - packages/*/node_modules/

# ✅ GLOBAL before_script (ĐÚNG CẤU TRÚC)
before_script:
  - node -v
  - npm -v
  - corepack enable
  - corepack prepare pnpm@10.28.1 --activate
  - pnpm config set store-dir .pnpm-store
  - pnpm -v

install_dependencies:
  stage: prepare
  script:
    - echo "Installing dependencies..."
    - pnpm install --frozen-lockfile
    - echo "Checking workspace structure..."
    - pnpm list --depth=0
    - echo "Checking if shared package is built..."
    - ls -la packages/shared/ || echo "Shared package directory not found"
  artifacts:
    paths:
      - node_modules/
      - apps/*/node_modules/
      - packages/*/node_modules/
    expire_in: 1 hour

lint:
  stage: lint
  dependencies:
    - install_dependencies
  script:
    - echo "Running lint..."
    - pnpm run lint
    - echo "Lint completed successfully"

test:
  stage: test
  dependencies:
    - install_dependencies
  script:
    - echo "No test ..."

build:
  stage: build
  dependencies:
    - install_dependencies
  script:
    - echo "Starting build process..."
    - echo "Building shared package..."
    - pnpm run build:shared
    - echo "Building API..."
    - pnpm run build:api
    - echo "Build completed successfully"
  artifacts:
    paths:
      - apps/*/dist/
      - packages/*/dist/
    expire_in: 1 week

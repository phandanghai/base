image: node:20-alpine

stages:
  - prepare
  - lint
  - test
  - build

variables:
  NODE_ENV: production
  NPM_CONFIG_LOGLEVEL: warn

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

before_script:
  - node -v
  - npm -v

install_dependencies:
  stage: prepare
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
lint:
  stage: lint
  script:
    - npm run lint

test:
  stage: test
  script:
    - npm run test

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/

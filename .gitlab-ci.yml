image: node:20-alpine

stages:
  - prepare
  - lint
  - test
  - build

variables:
  NPM_CONFIG_LOGLEVEL: warn

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .pnpm-store

# ✅ GLOBAL before_script (ĐÚNG CẤU TRÚC)
before_script:
  - node -v
  - npm -v
  - corepack enable
  - corepack prepare pnpm@9.12.0 --activate
  - pnpm -v

install_dependencies:
  stage: prepare
  script:
    - pnpm install --frozen-lockfile
  artifacts:
    paths:
      - node_modules/

lint:
  stage: lint
  script:
    - pnpm run lint

test:
  stage: test
  script:
    - pnpm run test

build:
  stage: build
  script:
    - pnpm run build
  artifacts:
    paths:
      - dist/

image: node:20-alpine

stages:
  - prepare
  - lint
  - test
  - build

variables:
  NODE_ENV: production
  NPM_CONFIG_LOGLEVEL: warn

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

before_script:
  before_script:
    - node -v
    - npm -v
    - corepack enable
    - corepack prepare pnpm@9.12.0 --activate
    - pnpm -v

install_dependencies:
  stage: prepare

  before_script:
    - node -v
    - npm -v
    - corepack enable
    - corepack prepare pnpm@9.12.0 --activate
    - pnpm -v

  script:
    - node -v
    - npm -v
    - corepack enable
    - corepack prepare pnpm@9.12.0 --activate
    - pnpm -v
    - pnpm install --frozen-lockfile
  artifacts:
    paths:
      - node_modules/
lint:
  stage: lint
  script:
    - npm run lint

test:
  stage: test
  script:
    - npm run test

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/

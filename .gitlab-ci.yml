stages:
  - trigger

.sync_shared_template:
  stage: sync
  only:
    - main

  variables:
    GIT_DEPTH: '0'

  before_script:
    - apk add --no-cache git git-subtree openssh bash
    - git config --global user.email "ci-bot@gitlab.com"
    - git config --global user.name "shared-ci-bot"

  script:
    - |
      set -e

      echo "======================================="
      echo "🔄 SERVICE: ${SERVICE_NAME}"
      echo "📦 BASE REPO: ${BASE_REPO_URL}"
      echo "🌿 BRANCH: ${BASE_BRANCH}"
      echo "📁 SUBTREE PATH: ${SUBTREE_PREFIX}"
      echo "======================================="

      git clone https://oauth2:${BASE_PUSH_TOKEN}@${BASE_REPO_URL} service_repo
      cd service_repo
      git checkout ${BASE_BRANCH}

      git remote add shared https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git
      git fetch shared main

      if [ -d "${SUBTREE_PREFIX}" ]; then
        echo "🗑 Remove old shared subtree"
        rm -rf "${SUBTREE_PREFIX}"
        git add "${SUBTREE_PREFIX}"
        git commit -m "chore(shared): reset subtree" || true
      fi

      echo "➕ Add shared subtree"
      git subtree add \
        --prefix="${SUBTREE_PREFIX}" \
        shared main \
        --squash

      echo "🚀 Push to ${SERVICE_NAME}"
      git push origin ${BASE_BRANCH}

      echo "✅ Sync ${SERVICE_NAME} done"

sync_shared:
  extends: .sync_shared_template
  parallel:
    matrix:
      - SERVICE_NAME: redis-service
        BASE_REPO_URL: gitlab.com/chienbinhthephai/redis.git
        BASE_BRANCH: main
        SUBTREE_PREFIX: src/shared
